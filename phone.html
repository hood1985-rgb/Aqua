<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04101d">
<title>Aqua — truck phone</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 40px;
    font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
    color: #e9f6ff;
    background: linear-gradient(160deg, #04101d, #072036 60%, #0b2c4a);
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h1 span { color: #46d7ff; }
  .sub { color: #9fc3de; font-size: 13px; margin-bottom: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.3px; color: #6f94b0; margin: 22px 0 10px; }
  .card {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(120,200,255,0.14);
    color: #e9f6ff; border-radius: 14px;
    padding: 15px 14px; margin-bottom: 9px;
    font-size: 16px; font-family: inherit;
  }
  button.card { cursor: pointer; }
  button.card:active { transform: scale(0.98); }
  .card.done { opacity: 0.5; }
  .card.done .t { text-decoration: line-through; }
  .n {
    flex: 0 0 26px; height: 26px; display: grid; place-items: center;
    border-radius: 8px; background: rgba(70,215,255,0.16);
    color: #46d7ff; font-size: 14px; font-weight: 700;
  }
  .t { flex: 1; line-height: 1.35; }
  .chk { font-size: 20px; color: #46d7ff; flex: 0 0 26px; text-align: center; }
  .hint { color: #6f94b0; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(120,200,255,0.14); border-radius: 10px;
    padding: 13px 12px; color: #e9f6ff; font-size: 16px; font-family: inherit;
  }
  input:focus { border-color: #46d7ff; outline: none; }
  .btn {
    border: none; cursor: pointer; border-radius: 10px;
    background: linear-gradient(135deg, #46d7ff, #2e8fff);
    color: #06233a; font-weight: 700; font-size: 15px; padding: 12px 18px;
  }
  .btn:active { transform: scale(0.96); }
  #pinbox {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(2,10,18,0.92); padding: 24px; z-index: 5;
  }
  #pinbox.hidden { display: none; }
  .pincard {
    width: min(340px, 92vw); background: #082640;
    border: 1px solid rgba(120,200,255,0.14); border-radius: 18px; padding: 24px;
    text-align: center;
  }
  .pincard input { text-align: center; font-size: 22px; letter-spacing: 6px; margin: 12px 0; }
  #status { text-align: center; color: #6f94b0; font-size: 12px; margin-top: 18px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(7,32,54,0.95); border: 1px solid rgba(120,200,255,0.14);
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    display: none; max-width: 90vw; text-align: center;
  }
</style>
</head>
<body>
  <h1>🌊 Aqua <span>truck phone</span></h1>
  <div class="sub" id="sub">today's route &amp; jobs</div>

  <h2>Today's route</h2>
  <div id="route"></div>

  <h2>Open jobs</h2>
  <div id="jobs"></div>
  <div class="row" style="margin-top:10px;">
    <input id="jobinput" placeholder="Add a job…" maxlength="200">
    <button class="btn" id="jobadd">Add</button>
  </div>

  <h2>Customers</h2>
  <div id="customers"></div>

  <div id="status">connecting…</div>

  <div id="pinbox">
    <div class="pincard">
      <h1>🔑 Sync PIN</h1>
      <div class="sub">It's in Aqua's 🚚 Truck view, under Phone sync.</div>
      <input id="pininput" inputmode="numeric" maxlength="6" placeholder="••••••">
      <button class="btn" id="pinsave" style="width:100%;">Connect</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
"use strict";
(function () {
  var pin = localStorage.getItem("aqua-sync-pin") || "";
  var pinbox = document.getElementById("pinbox");
  var status = document.getElementById("status");
  var toastTimer = null;

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = "none"; }, 2500);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path, opts) {
    opts = opts || {};
    var url = path + (path.indexOf("?") >= 0 ? "&" : "?") + "pin=" + encodeURIComponent(pin);
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { pinbox.classList.remove("hidden"); throw new Error("pin"); }
      return r.json();
    });
  }

  function load() {
    if (!pin) { pinbox.classList.remove("hidden"); status.textContent = "enter your PIN"; return; }
    api("/api/state").then(function (j) {
      if (!j.ok) throw new Error("bad");
      render(j.snapshot || {});
      var d = new Date();
      status.textContent = "updated " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }).catch(function (e) {
      if (e.message !== "pin") status.textContent = "can't reach Aqua — same WiFi?";
    });
  }

  function render(snap) {
    var route = document.getElementById("route");
    var stops = snap.route || [];
    var done = snap.routeDone || [];
    route.innerHTML = stops.length ? "" : '<div class="hint">No route planned today.</div>';
    stops.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "card" + (done.indexOf(s.id) >= 0 ? " done" : "");
      b.innerHTML = '<span class="chk">' + (done.indexOf(s.id) >= 0 ? "✓" : "○") +
        '</span><span class="n">' + (i + 1) + '</span><span class="t">' + esc(s.text) + "</span>";
      b.addEventListener("click", function () {
        send({ kind: "route-done", id: s.id }, "route updated");
      });
      route.appendChild(b);
    });

    var jobs = document.getElementById("jobs");
    var open = (snap.tasks || []).filter(function (t) { return !t.done; });
    jobs.innerHTML = open.length ? "" : '<div class="hint">No open jobs — smooth sailing.</div>';
    open.forEach(function (t, i) {
      var b = document.createElement("button");
      b.className = "card";
      b.innerHTML = '<span class="chk">○</span><span class="n">' + (i + 1) +
        '</span><span class="t">' + esc(t.text) + "</span>";
      b.addEventListener("click", function () {
        send({ kind: "job-done", id: t.id }, "job checked off");
      });
      jobs.appendChild(b);
    });

    var cust = document.getElementById("customers");
    var list = snap.customers || [];
    cust.innerHTML = list.length ? "" : '<div class="hint">No customers on file.</div>';
    list.forEach(function (c) {
      var d = document.createElement("div");
      d.className = "card";
      d.innerHTML = '<span class="t">' + esc(c.text) + "</span>";
      cust.appendChild(d);
    });
  }

  function send(op, msg) {
    api("/api/op", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(op),
    }).then(function (j) {
      if (j.ok) { toast(msg || "sent"); setTimeout(load, 600); }
      else toast("hmm, that didn't go through");
    }).catch(function () { toast("can't reach Aqua"); });
  }

  document.getElementById("jobadd").addEventListener("click", function () {
    var inp = document.getElementById("jobinput");
    var text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    send({ kind: "job-add", text: text }, "job added");
  });

  document.getElementById("pinsave").addEventListener("click", function () {
    pin = document.getElementById("pininput").value.trim();
    if (!pin) return;
    localStorage.setItem("aqua-sync-pin", pin);
    pinbox.classList.add("hidden");
    load();
  });

  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
