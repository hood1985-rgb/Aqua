name: Build Aqua for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out Aqua
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Code signing activates only when a CSC_LINK certificate secret exists;
      # the guard below writes nothing to the environment otherwise, so
      # unsigned builds keep working exactly as before.
      - name: Configure code signing (optional)
        shell: bash
        env:
          CSC_CERT: ${{ secrets.CSC_LINK }}
          CSC_PASS: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_CERT" ]; then
            printf 'CSC_LINK<<__CERT__\n%s\n__CERT__\n' "$CSC_CERT" >> "$GITHUB_ENV"
            if [ -n "$CSC_PASS" ]; then
              printf 'CSC_KEY_PASSWORD<<__PASS__\n%s\n__PASS__\n' "$CSC_PASS" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the installer & portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Aqua-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      - name: Publish a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-r{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Aqua {0}', github.ref_name) || format('Aqua 1.0.0 (build {0})', github.run_number) }}
